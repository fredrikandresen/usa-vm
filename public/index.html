<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova VM 2026</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="index">
    <main class="shell landing-shell">
      <section class="hero card">
        <div class="hero-copy">
          <p class="eyebrow">FIFA World Cup 2026</p>
          <h1 data-i18n="appName">Nova VM 2026</h1>
          <p class="muted" data-i18n="tagline">Predict the World Cup. Climb the leaderboard.</p>
        </div>
        <label class="language-picker">
          <span data-i18n="language">Language</span>
          <select id="language-select"></select>
        </label>
      </section>

      <section class="grid two-up">
        <form id="login-form" class="card stack">
          <h2 data-i18n="loginTitle">Login with magic link</h2>
          <label>
            <span data-i18n="email">Email</span>
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <button type="submit" class="button-primary" data-i18n="requestMagicLink">Send magic link</button>
        </form>

        <form id="signup-form" class="card stack">
          <h2 data-i18n="signupTitle">Create your account</h2>
          <label>
            <span data-i18n="name">Name</span>
            <input name="name" required autocomplete="name" />
          </label>
          <label>
            <span data-i18n="email">Email</span>
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            <span data-i18n="company">Company</span>
            <select name="company" id="company-select" required></select>
          </label>
          <button type="submit" class="button-primary" data-i18n="createAccount">Create account</button>
        </form>
      </section>

      <section id="auth-feedback" class="card stack hidden">
        <p id="auth-message"></p>
        <a id="magic-link" class="button-secondary hidden" href="/app.html" data-i18n="continueNow">Continue now</a>
        <small class="muted" data-i18n="syncHint">Results update automatically after admin sync.</small>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
